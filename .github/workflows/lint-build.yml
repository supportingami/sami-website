# Basic test to ensure PRs pass lint build. Default runner except when preview deployment already generated
name: Lint and Build
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE*"
concurrency:
  group: lint-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.pull_request.labels.*.name, 'Test - preview')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0

      #############################################################################
      #         Node Modules & Dependency Cache
      # Caches .yarn/cache AND all workspace node_modules for near-instant install
      #############################################################################
      - name: Restore Yarn & Node Modules Cache
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
            frontend/node_modules
            backend/node_modules
            scripts/node_modules
          key: yarn-nm-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-nm-${{ runner.os }}-

      - name: Install node modules
        run: yarn install --immutable

      #############################################################################
      #         Lint, Setup and Build
      #############################################################################
      - name: Lint Code
        run: yarn lint

      - name: Bootstrap Strapi
        run: yarn scripts strapi bootstrap --environment development --no-admin-build

      - name: Setup dev environment
        run: yarn scripts strapi import --environment development

      - name: Build
        run: yarn build --no-export --no-preview --no-deploy --no-optimize-images
